<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Vedhasri Ayurveda</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="brand"><img src="assets/images/logo.jpeg" alt="Vedhasri" class="brand-logo"></a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop All</a>
                <a href="about.html">Our Story</a>
            </nav>

            <div class="header-icons">
                <a href="wishlist.html" class="icon-btn" title="Wishlist">
                    <i class="fa-regular fa-heart"></i>
                    <span class="badge" id="wishlist-count" style="display: none;">0</span>
                </a>
                <a href="cart.html" class="icon-btn" title="Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="badge" id="cart-count">0</span>
                </a>
                <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="section" style="padding-top: var(--spacing-xl); min-height: 70vh;">
        <div class="container">
            <h1 style="margin-bottom: var(--spacing-xl);">Your Cart</h1>

            <div class="cart-layout" id="cartContainer">
                <!-- Cart Content will be injected here -->
            </div>
        </div>
    </section>

    <!-- Order Summary Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 style="margin-bottom: var(--spacing-md);">Order Summary</h2>
            <div id="modalOrderDetails"
                style="margin-bottom: var(--spacing-lg); font-size: 0.95rem; line-height: 1.5; color: var(--text-dark);">
                <!-- Injected via JS -->
            </div>
            <button class="btn btn-primary" id="confirmOrderBtn"
                style="width: 100%; background-color: #25D366; border:none; justify-content: center;">
                <i class="fa-brands fa-whatsapp" style="margin-right: 8px; font-size: 1.2rem;"></i> Confirm on WhatsApp
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });

        function updateQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                saveCart();
                renderCart();
            }
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            renderCart();
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        function renderCart() {
            const container = document.getElementById('cartContainer');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fa-solid fa-cart-arrow-down"></i>
                        <h3>Your cart is empty</h3>
                        <p style="margin-bottom: var(--spacing-lg);">Looks like you haven't added anything to your cart yet.</p>
                        <a href="products.html" class="btn btn-primary">Start Shopping</a>
                    </div>
                `;
                return;
            }

            let cartHTML = `<div class="cart-items animate-fade-in">`;
            let subtotal = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                cartHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-img">
                        <div class="cart-item-info">
                            <span style="font-size: 0.8rem; color: var(--text-light); text-transform:uppercase;">${item.category}</span>
                            <h4><a href="product.html?id=${item.id}">${item.name}</a></h4>
                            <div style="font-size: 0.75rem; color: var(--text-light); margin-bottom: 2px;">Code: ${item.productCode}</div>
                            <div class="cart-item-price">${formatPrice(item.price)}</div>
                        </div>
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                            <span style="font-weight: 500; min-width: 20px; text-align: center;">${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})" title="Remove item">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });

            cartHTML += `</div>`;

            // Checkout Panel
            const deliveryFee = subtotal > 1000 ? 0 : 50;
            const total = subtotal + deliveryFee;

            cartHTML += `
                <div class="checkout-panel animate-fade-in" style="animation-delay: 0.1s">
                    <h3 style="margin-bottom: var(--spacing-md);">Order Summary</h3>
                    
                    <div class="order-summary">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>${formatPrice(subtotal)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Delivery</span>
                            <span>${deliveryFee === 0 ? 'Free' : formatPrice(deliveryFee)}</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>${formatPrice(total)}</span>
                        </div>
                    </div>

                    <h3 style="margin-bottom: var(--spacing-md);">Delivery Details</h3>
                    <form id="checkoutForm">
                        <div class="form-group">
                            <label for="c_name">Full Name</label>
                            <input type="text" id="c_name" class="form-control" required placeholder="Jane Doe">
                        </div>
                        <div class="form-group">
                            <label for="c_phone">Phone Number</label>
                            <input type="tel" id="c_phone" class="form-control" required placeholder="+91 9876543210">
                        </div>
                        <div class="form-group">
                            <label for="c_address">Complete Delivery Address</label>
                            <textarea id="c_address" class="form-control" rows="3" required placeholder="123 Street, City, State, PIN"></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: var(--spacing-md); background-color: #25D366; border:none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);">
                            <i class="fa-brands fa-whatsapp" style="margin-right: 8px; font-size: 1.2rem;"></i> Place Order via WhatsApp
                        </button>
                        <p style="text-align: center; font-size: 0.8rem; color: var(--text-light); margin-top: 10px;">
                            You will be redirected to WhatsApp to confirm your order.
                        </p>
                    </form>
                </div>
            `;

            container.innerHTML = cartHTML;

            // Attach form handler
            document.getElementById('checkoutForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const details = {
                    name: document.getElementById('c_name').value.trim(),
                    phone: document.getElementById('c_phone').value.trim(),
                    address: document.getElementById('c_address').value.trim()
                };

                // Generate summary HTML
                let summaryHTML = `
                    <p><strong>Name:</strong> ${details.name}</p>
                    <p><strong>Phone:</strong> ${details.phone}</p>
                    <p><strong>Address:</strong> ${details.address}</p>
                    <hr style="margin: 10px 0; border: none; border-top: 1px solid var(--border-color);">
                    <p><strong>Items:</strong></p>
                    <ul style="margin-left: 20px; margin-bottom: 10px;">
                `;

                cart.forEach(item => {
                    summaryHTML += `<li>${item.name} (x${item.quantity})</li>`;
                });

                summaryHTML += `
                    </ul>
                    <p><strong>Total Amount:</strong> ${formatPrice(total)}</p>
                `;

                document.getElementById('modalOrderDetails').innerHTML = summaryHTML;
                document.getElementById('orderModal').classList.add('active');

                // Confirm button click
                document.getElementById('confirmOrderBtn').onclick = () => {
                    const msgParams = generateWhatsAppMessage(details);
                    const waNumber = "918489307118";
                    const waUrl = `https://wa.me/${waNumber}?text=${msgParams}`;
                    window.open(waUrl, '_blank');
                    closeModal();
                };
            });
        }
    </script>
</body>

</html>
