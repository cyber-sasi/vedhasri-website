<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wishlist | Vedhasri Ayurveda</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: var(--spacing-lg);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="brand"><img src="assets/images/logo.jpeg" alt="Vedhasri" class="brand-logo"></a>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop All</a>
                <a href="about.html">Our Story</a>
            </nav>
            
            <div class="header-icons">
                <a href="wishlist.html" class="icon-btn active" title="Wishlist">
                    <i class="fa-solid fa-heart" style="color: #ff4757;"></i>
                    <span class="badge" id="wishlist-count" style="display: none;">0</span>
                </a>
                <a href="cart.html" class="icon-btn" title="Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="badge" id="cart-count">0</span>
                </a>
                <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="section" style="padding-top: var(--spacing-xl); min-height: 70vh;">
        <div class="container">
            <h1 style="margin-bottom: var(--spacing-xl);">Your Wishlist</h1>
            
            <div id="wishlistContainer" class="wishlist-grid">
                <!-- Wishlist Items will be injected here -->
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderWishlist();
        });

        function renderWishlist() {
            const container = document.getElementById('wishlistContainer');
            
            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fa-regular fa-heart"></i>
                        <h3>Your wishlist is empty</h3>
                        <p style="margin-bottom: var(--spacing-lg);">Save your favorite items here to review later.</p>
                        <a href="products.html" class="btn btn-primary">Discover Products</a>
                    </div>
                `;
                return;
            }

            let html = '';
            wishlist.forEach(item => {
                // Ensure proper active state for heart toggle
                html += `
                    <div class="product-card animate-fade-in" id="wishlist-item-${item.id}">
                        <div class="product-image-wrap">
                            <button class="wishlist-btn active" data-id="${item.id}" onclick="removeFromWishlistPage(${item.id})">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                            <a href="product.html?id=${item.id}">
                                <img src="${item.image}" alt="${item.name}">
                            </a>
                        </div>
                        <div class="product-info">
                            <a href="product.html?id=${item.id}" class="product-title">${item.name}</a>
                            <div class="product-price">${formatPrice(item.price)}</div>
                            <div class="product-actions">
                                <button class="btn btn-primary" style="width: 100%;" onclick="addToCart(${item.id})">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function removeFromWishlistPage(id) {
            toggleWishlist(id); // Using the global app.js function to toggle (remove)
            renderWishlist();   // Re-render the page
        }
    </script>
</body>
</html>
